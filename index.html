<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公開鍵暗号 体験ツール</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--navy:#17365d;--blue:#2563eb;--green:#23845f;--red:#c44d45;--ink:#182230;--muted:#64748b;--line:#d8e0ea;--bg:#f4f7fb;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic",Meiryo,system-ui,sans-serif;line-height:1.55}
.wrap{max-width:1120px;margin:auto;padding:0 18px}
header{background:var(--navy);color:#fff;padding:20px 0}
h1{margin:0;font-size:clamp(23px,4vw,34px)}
header p{margin:4px 0 0;opacity:.9;font-size:13px}
main{padding:22px 0 36px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 18px rgba(30,50,80,.06);padding:20px}
.section-title{font-size:20px;font-weight:800;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 15px}
.grid{display:grid;gap:16px}.grid2{grid-template-columns:1fr 1fr}
label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
input,textarea,select{width:100%;font:inherit;border:1px solid #c8d2df;border-radius:10px;background:#fff;padding:10px 12px;color:var(--ink)}
textarea{resize:vertical;min-height:105px}
input:focus,textarea:focus,select:focus,button:focus{outline:3px solid rgba(37,99,235,.18);outline-offset:2px}
button{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer}
button:hover{filter:brightness(.98)}button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.ghost{background:#edf2f7;color:var(--navy)}.danger{background:#fde7e3;color:#9d4038}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.status{min-height:20px;margin-top:8px;font-size:13px;font-weight:700}.ok{color:var(--green)}.bad{color:var(--red)}.info{color:var(--blue)}
.key-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.keybox{padding:12px;border-radius:12px}.pub{background:#eef5ff;border:2px solid #b8d0ff}.priv{background:#fff2ed;border:2px solid #f0bbb0}
.key-label{font-size:11px;font-weight:800}.key-num{margin-top:2px;font-family:ui-monospace,Consolas,monospace;font-weight:900;font-size:29px;letter-spacing:.12em}
.small{font-size:12px;color:var(--muted)}
.participants{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.person{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.person .name{font-weight:900;font-size:15px}
.person .public-key{margin-top:7px;background:#eef5ff;border-radius:8px;padding:6px;font-family:ui-monospace,Consolas,monospace;font-weight:800}
.person .you{font-size:11px;color:var(--green);font-weight:800;margin-top:5px}
.cipher{background:#13243e;color:#e7eef8;border-radius:10px;padding:11px;font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all;white-space:pre-wrap;min-height:70px}
.preview{padding:11px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe;white-space:pre-wrap;min-height:70px}
.lockflow{display:grid;grid-template-columns:1fr 70px 1fr;gap:12px;align-items:center}
.arrow{font-size:34px;text-align:center;color:#9aa8bb}
.inbox{display:grid;gap:12px}
.message-item{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fbfcfe}
.message-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;background:#eef5ff;color:var(--blue);font-size:11px;font-weight:800}
.result{margin-top:11px;padding:12px;border-radius:10px;background:#f1faf5;border:2px solid #bfe4d0;display:none}
.roombar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.roombar>div:first-child{flex:1;min-width:240px}
.room-status{padding:9px 11px;border-radius:10px;background:#f8fafc;border:1px solid var(--line);font-size:12px}
.hide{display:none!important}
.note{margin-top:12px;padding:9px 11px;border-radius:10px;background:#f8fafc;border:1px solid var(--line);font-size:12px;color:var(--muted)}
@media(max-width:850px){.grid2{grid-template-columns:1fr}.participants{grid-template-columns:repeat(2,1fr)}.lockflow{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}
@media(max-width:520px){.participants{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>公開鍵暗号 体験ツール</h1>
    <p>同じURLを開いた参加者どうしで、メッセージを送受信できます。</p>
  </div>
</header>

<main class="wrap">
  <section class="card" style="margin-bottom:18px">
    <h2 class="section-title">あなたの登録</h2>
    <p class="sub">表示名を決めて、3桁の鍵を発行してください。</p>
    <div class="grid grid2">
      <div>
        <label for="display-name">表示名</label>
        <input id="display-name" maxlength="20" placeholder="例：Aさん、山田" autocomplete="nickname">
        <div class="row" style="margin-top:12px">
          <button id="generate-key" class="ghost" type="button">3桁の鍵を発行</button>
        </div>
      </div>
      <div>
        <div class="key-grid" style="margin-top:0">
          <div class="keybox pub"><div class="key-label">公開鍵</div><div id="my-public" class="key-num">---</div></div>
          <div class="keybox priv"><div class="key-label">秘密鍵</div><div id="my-private" class="key-num">---</div></div>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top:15px">
      <button id="register-button" class="primary" type="button">この名前・鍵で参加</button>
      <button id="clear-local" class="ghost" type="button">この端末の登録を消す</button>
      <div id="register-status" class="status grow" aria-live="polite"></div>
    </div>
  </section>

  <section class="card" style="margin-bottom:18px">
    <div class="roombar">
      <div>
        <div class="small">共有URL</div>
        <input id="share-url" type="text" readonly>
      </div>
      <button id="copy-url" class="primary" type="button">URLをコピー</button>
    </div>
    <div id="room-status" class="room-status" style="margin-top:10px">未接続</div>
  </section>

  <section class="card" style="margin-bottom:18px">
    <h2 class="section-title">参加者</h2>
    <div id="participant-count" class="small">0名</div>
    <div id="participant-grid" class="participants"></div>
    <div id="empty" class="note">参加登録すると、ここに表示されます。</div>
  </section>

  <section class="card" style="margin-bottom:18px">
    <h2 class="section-title">メッセージを送る</h2>
    <div class="grid grid2">
      <div>
        <label for="recipient">宛先</label>
        <select id="recipient" disabled><option value="">参加者を登録してください</option></select>
      </div>
      <div>
        <label for="send-public">公開鍵</label>
        <input id="send-public" inputmode="numeric" maxlength="3" placeholder="宛先の公開鍵3桁">
      </div>
    </div>
    <div style="margin-top:13px">
      <label for="message">メッセージ</label>
      <textarea id="message" maxlength="180" placeholder="伝えたいメッセージ"></textarea>
      <div id="count" class="small" style="text-align:right">0 / 180</div>
    </div>
    <div class="row" style="margin-top:11px">
      <button id="encrypt-button" class="primary" type="button" disabled>公開鍵で暗号化して送信</button>
      <button id="copy-cipher" class="ghost" type="button" disabled>暗号文をコピー</button>
      <div id="send-status" class="status grow" aria-live="polite"></div>
    </div>
    <div class="lockflow" style="margin-top:15px">
      <div><div class="small">送信するデータ</div><div id="plain-preview" class="preview" style="margin-top:6px">—</div></div>
      <div class="arrow">→</div>
      <div><div class="small">暗号化されたデータ</div><div id="cipher-output" class="cipher" style="margin-top:6px">—</div></div>
    </div>
  </section>

  <section class="card">
    <h2 class="section-title">受信箱</h2>
    <div id="inbox" class="inbox">
      <div id="inbox-empty" class="note">まだメッセージはありません。</div>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";

  const encoder = new TextEncoder();
  const decoder = new TextDecoder();
  const PROFILE_KEY = "public-key-demo-profile-v4";
  const PEER_PREFIX = "pkdemo-h-";
  const E = 17;

  const KEY_PAIRS = [
    [299,233],[377,257],[391,145],[403,233],
    [407,233],[437,233],[451,353],[473,173],[481,305],[493,369],[517,433],
    [527,113],[533,113],[589,413],[629,305],[649,273],[667,145],[689,257],
    [697,113],[703,305],[713,233],[731,593],[779,593],[799,433],[851,233],
    [893,341],[943,673],[989,761]
  ];

  let myProfile = null;
  let myPeer = null;
  let isHost = false;
  let hostConnection = null;
  let participants = [];
  let directConnections = new Map();
  let latestCipher = "";

  const $ = id => document.getElementById(id);

  function status(id, msg, cls="info") {
    const el = $(id);
    el.textContent = msg;
    el.className = "status " + cls;
  }

  function valid3(v) {
    return /^\d{3}$/.test(String(v)) && Number(v) >= 100 && Number(v) <= 999;
  }

  function formatName(n) {
    return n.endsWith("さん") ? n : n + "さん";
  }

  function saveProfile() {
    localStorage.setItem(PROFILE_KEY, JSON.stringify(myProfile));
  }

  function loadProfile() {
    try { myProfile = JSON.parse(localStorage.getItem(PROFILE_KEY) || "null"); }
    catch { myProfile = null; }
  }

  function showKeys() {
    $("my-public").textContent = myProfile?.publicKey || "---";
    $("my-private").textContent = myProfile?.privateKey || "---";
    if (myProfile) $("display-name").value = myProfile.name || "";
  }

  function generatePair() {
    const r = new Uint32Array(1);
    crypto.getRandomValues(r);
    const pair = KEY_PAIRS[r[0] % KEY_PAIRS.length];
    myProfile = {
      name: $("display-name").value.trim(),
      publicKey: String(pair[0]),
      privateKey: String(pair[1])
    };
    showKeys();
    saveProfile();
    status("register-status", "3桁の鍵を発行しました。", "ok");
  }

  function clearLocal() {
    localStorage.removeItem(PROFILE_KEY);
    if (myPeer) {
      try { myPeer.destroy(); } catch {}
    }
    myProfile = null;
    myPeer = null;
    isHost = false;
    hostConnection = null;
    participants = [];
    directConnections.clear();
    showKeys();
    renderParticipants();
    renderRecipient();
    $("display-name").value = "";
    setRoomStatus("未接続");
    status("register-status", "この端末の登録を消しました。", "ok");
  }

  function modPow(base, exp, mod) {
    let b = base % mod, e = Number(exp), r = 1;
    while (e > 0) {
      if (e % 2 === 1) r = (r * b) % mod;
      b = (b * b) % mod;
      e = Math.floor(e / 2);
    }
    return r;
  }

  function rsaEncrypt(text, n) {
    const bytes = encoder.encode(text);
    const c = [];
    for (const m of bytes) c.push(modPow(m, E, n));
    return JSON.stringify({v:1, n:Number(n), e:E, c});
  }

  function rsaDecrypt(cipher, d) {
    let obj;
    try { obj = JSON.parse(cipher); }
    catch { throw new Error("暗号文の形式が正しくありません。"); }
    if (!obj || obj.v !== 1 || !valid3(obj.n) || obj.e !== E || !Array.isArray(obj.c)) {
      throw new Error("暗号文の形式が正しくありません。");
    }
    const n = Number(obj.n);
    const out = [];
    for (const c of obj.c) {
      if (!Number.isInteger(c) || c < 0 || c >= n) throw new Error("暗号文が壊れています。");
      const m = modPow(c, Number(d), n);
      if (m < 0 || m > 255) throw new Error("秘密鍵が一致しません。");
      out.push(m);
    }
    return decoder.decode(new Uint8Array(out));
  }

  function makeRoomId() {
    let s = location.origin + location.pathname + location.search;
    // 静的ファイルを同じURLで共有するため、URLから安定した短いIDを作る。
    let h = 2166136261;
    for (let i=0;i<s.length;i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    return ("00000000" + (h >>> 0).toString(16)).slice(-8);
  }

  const ROOM_ID = makeRoomId();
  const HOST_ID = PEER_PREFIX + ROOM_ID;

  function setRoomStatus(msg) {
    $("room-status").textContent = msg;
  }

  function addParticipant(p) {
    if (!p || !p.peerId || !p.displayName || !valid3(p.publicKey)) return;
    const existing = participants.findIndex(x => x.peerId === p.peerId);
    if (existing >= 0) participants[existing] = p;
    else participants.push(p);
    renderParticipants();
    renderRecipient();
  }

  function removeParticipant(peerId) {
    participants = participants.filter(p => p.peerId !== peerId);
    const conn = directConnections.get(peerId);
    if (conn) { try { conn.close(); } catch {} }
    directConnections.delete(peerId);
    renderParticipants();
    renderRecipient();
  }

  function renderParticipants() {
    const grid = $("participant-grid");
    grid.innerHTML = "";
    const list = participants.slice().sort((a,b) => a.displayName.localeCompare(b.displayName, "ja"));
    list.forEach(p => {
      const div = document.createElement("div");
      div.className = "person";
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = formatName(p.displayName);
      const pk = document.createElement("div");
      pk.className = "public-key";
      pk.textContent = "公開鍵：" + p.publicKey;
      div.appendChild(name);
      div.appendChild(pk);
      if (myProfile && p.peerId === myProfile.peerId) {
        const you = document.createElement("div");
        you.className = "you";
        you.textContent = "あなた";
        div.appendChild(you);
      }
      grid.appendChild(div);
    });
    $("participant-count").textContent = participants.length + "名";
    $("empty").style.display = participants.length ? "none" : "block";
  }

  function renderRecipient() {
    const sel = $("recipient");
    const prev = sel.value;
    sel.innerHTML = "";
    if (participants.length <= 1 || !myProfile) {
      sel.disabled = true;
      sel.appendChild(new Option("他の参加者を待っています…", ""));
      $("encrypt-button").disabled = true;
      $("send-public").value = "";
      return;
    }
    const others = participants.filter(p => p.peerId !== myProfile.peerId);
    others.forEach(p => sel.appendChild(new Option(formatName(p.displayName), p.peerId)));
    sel.disabled = false;
    if (others.some(p => p.peerId === prev)) sel.value = prev;
    else sel.selectedIndex = 0;
    syncRecipientKey();
  }

  function syncRecipientKey() {
    const peerId = $("recipient").value;
    const p = participants.find(x => x.peerId === peerId);
    $("send-public").value = p?.publicKey || "";
    $("encrypt-button").disabled = !p || !myProfile;
  }

  function makeProfileForSession() {
    const name = $("display-name").value.trim();
    if (!name) {
      status("register-status", "表示名を入力してください。", "bad");
      return false;
    }
    if (!myProfile || !valid3(myProfile.publicKey) || !valid3(myProfile.privateKey) || myProfile.name !== name) {
      generatePair();
      myProfile.name = name;
      saveProfile();
    }
    return true;
  }

  function participantData() {
    return {
      peerId: myProfile.peerId,
      displayName: myProfile.name,
      publicKey: myProfile.publicKey
    };
  }

  function broadcastRoster() {
    if (!isHost) return;
    const packet = {type:"roster", participants};
    directConnections.forEach(conn => {
      if (conn && conn.open) {
        try { conn.send(packet); } catch {}
      }
    });
    if (hostConnection && hostConnection.open) {
      try { hostConnection.send(packet); } catch {}
    }
  }

  function setupConnection(conn) {
    directConnections.set(conn.peer, conn);
    conn.on("data", data => handleData(conn, data));
    conn.on("close", () => {
      if (isHost && directConnections.has(conn.peer)) {
        removeParticipant(conn.peer);
        broadcastRoster();
      }
      if (hostConnection === conn) {
        hostConnection = null;
        if (!isHost && myPeer) {
          try { myPeer.destroy(); } catch {}
          myPeer = null;
        }
        setRoomStatus("接続ハブとの接続が切れました。再接続中…");
        setTimeout(() => attemptJoinOrHost(), 350);
      }
      directConnections.delete(conn.peer);
    });
    conn.on("error", () => {});
  }

  function handleData(conn, data) {
    if (!data || typeof data !== "object") return;

    if (data.type === "join" && isHost) {
      const p = data.participant;
      addParticipant(p);
      broadcastRoster();
      setRoomStatus("共有接続中（ホスト）");
      return;
    }

    if (data.type === "roster" && !isHost) {
      participants = Array.isArray(data.participants) ? data.participants : [];
      renderParticipants();
      renderRecipient();
      setRoomStatus("共有接続中");
      return;
    }

    if (data.type === "message") {
      addIncomingMessage(data);
    }
  }

  function addIncomingMessage(data) {
    const inbox = $("inbox");
    const empty = $("inbox-empty");
    if (empty) empty.remove();

    const item = document.createElement("div");
    item.className = "message-item";

    const head = document.createElement("div");
    head.className = "message-head";
    const sender = document.createElement("strong");
    sender.textContent = formatName(data.fromName || "送信者");
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = "暗号文";
    head.appendChild(sender);
    head.appendChild(badge);

    const cipher = document.createElement("div");
    cipher.className = "cipher";
    cipher.style.marginTop = "9px";
    cipher.textContent = String(data.ciphertext || "");

    const controls = document.createElement("div");
    controls.className = "row";
    controls.style.marginTop = "9px";

    const key = document.createElement("input");
    key.inputMode = "numeric";
    key.maxLength = 3;
    key.placeholder = "秘密鍵3桁";
    key.value = myProfile?.privateKey || "";
    key.style.maxWidth = "150px";

    const btn = document.createElement("button");
    btn.className = "green";
    btn.type = "button";
    btn.textContent = "秘密鍵で復号";

    const result = document.createElement("div");
    result.className = "result";

    btn.addEventListener("click", () => {
      if (!valid3(key.value)) {
        setStatus("send-status", "秘密鍵は3桁の数字で入力してください。", "bad");
        return;
      }
      try {
        const plain = rsaDecrypt(String(data.ciphertext || ""), key.value);
        result.style.display = "block";
        result.textContent = "復号結果： " + plain;
      } catch {
        result.style.display = "none";
        alert("復号できませんでした。秘密鍵を確認してください。");
      }
    });

    controls.appendChild(key);
    controls.appendChild(btn);
    item.appendChild(head);
    item.appendChild(cipher);
    item.appendChild(controls);
    item.appendChild(result);
    inbox.prepend(item);
  }

  function connectToPeer(peerId) {
    if (!myPeer || peerId === myPeer.id) return;
    const old = directConnections.get(peerId);
    if (old && old.open) return old;
    const conn = myPeer.connect(peerId, {reliable:true});
    setupConnection(conn);
    return conn;
  }

  function becomeHost() {
    if (!myProfile) return;
    cleanupPeer(false);
    isHost = true;
    const peer = new Peer(HOST_ID, {debug:0});
    myPeer = peer;

    peer.on("open", id => {
      myProfile.peerId = id;
      saveProfile();
      participants = [participantData()];
      renderParticipants();
      renderRecipient();
      setRoomStatus("共有接続中（ホスト）");
      status("register-status", "参加しました。", "ok");
    });

    peer.on("connection", conn => {
      setupConnection(conn);
      conn.on("open", () => {});
      // join処理を待つ
    });

    peer.on("error", err => {
      if (err && (err.type === "unavailable-id" || err.type === "server-error")) {
        isHost = false;
        cleanupPeer(false);
        createPersonalPeerAndJoin();
      } else {
        isHost = false;
        setRoomStatus("接続エラー");
        status("register-status", "共有接続に失敗しました。ページを再読み込みしてください。", "bad");
      }
    });

    peer.on("disconnected", () => {
      setRoomStatus("接続が切れました。再接続中…");
      try { peer.reconnect(); } catch {}
    });
  }

  function createPersonalPeerAndJoin() {
    const peer = new Peer(undefined, {debug:0});
    myPeer = peer;
    isHost = false;

    peer.on("connection", conn => {
      setupConnection(conn);
    });

    peer.on("open", id => {
      myProfile.peerId = id;
      saveProfile();

      const conn = peer.connect(HOST_ID, {reliable:true});
      hostConnection = conn;
      setupConnection(conn);

      conn.on("open", () => {
        conn.send({type:"join", participant:participantData()});
        setRoomStatus("共有接続中");
        status("register-status", "参加しました。", "ok");
      });

      conn.on("error", () => {
        setRoomStatus("接続ハブに接続できません。ホストを開始します…");
        attemptJoinOrHost();
      });
    });

    peer.on("error", err => {
      setRoomStatus("接続エラー");
      status("register-status", "通信に失敗しました。ネットワーク接続を確認してください。", "bad");
      // 新しいpeer IDで再試行
      if (err && err.type === "network") {
        setTimeout(() => createPersonalPeerAndJoin(), 1200);
      }
    });
  }

  function cleanupPeer(destroy=true) {
    if (!myPeer) return;
    try {
      if (destroy) myPeer.destroy();
    } catch {}
    myPeer = null;
    hostConnection = null;
    directConnections.clear();
  }

  function attemptJoinOrHost() {
    if (!myProfile) return;

    if (myPeer && !myPeer.destroyed && myPeer.open) return;

    // 固定ホストIDが空いていればホスト、埋まっていれば参加者になる。
    const tester = new Peer(HOST_ID, {debug:0});
    let decided = false;

    const finishAsHost = () => {
      if (decided) return;
      decided = true;
      try { tester.destroy(); } catch {}
      setTimeout(() => becomeHost(), 60);
    };

    tester.on("open", () => finishAsHost());
    tester.on("error", err => {
      if (decided) return;
      decided = true;
      try { tester.destroy(); } catch {}
      // 既にホストがいる
      if (err && err.type === "unavailable-id") {
        setTimeout(() => createPersonalPeerAndJoin(), 100);
      } else {
        setRoomStatus("接続先を確認しています…");
        setTimeout(() => createPersonalPeerAndJoin(), 500);
      }
    });

    setTimeout(() => {
      if (!decided) {
        decided = true;
        try { tester.destroy(); } catch {}
        setTimeout(() => createPersonalPeerAndJoin(), 200);
      }
    }, 5000);
  }

  async function register() {
    if (!makeProfileForSession()) return;
    // peer IDが保存されていても、別タブで古い接続を持っている可能性があるため再接続する。
    if (myPeer && !myPeer.destroyed) {
      setRoomStatus(isHost ? "共有接続中（ホスト）" : "共有接続中");
      return;
    }
    setRoomStatus("接続しています…");
    status("register-status", "参加者として接続しています…", "info");
    attemptJoinOrHost();
  }

  function encryptAndSend() {
    const recipient = participants.find(p => p.peerId === $("recipient").value);
    const text = $("message").value.trim();
    const pub = $("send-public").value.trim();

    if (!recipient) { status("send-status", "宛先を選択してください。", "bad"); return; }
    if (!valid3(pub) || pub !== String(recipient.publicKey)) { status("send-status", "宛先の公開鍵3桁を確認してください。", "bad"); return; }
    if (!text) { status("send-status", "メッセージを入力してください。", "bad"); return; }

    try {
      const cipher = rsaEncrypt(text, Number(pub));
      latestCipher = cipher;
      $("plain-preview").textContent = text;
      $("cipher-output").textContent = cipher;
      $("copy-cipher").disabled = false;

      const conn = connectToPeer(recipient.peerId);
      const sendPacket = () => {
        try {
          conn.send({
            type:"message",
            fromPeerId:myProfile.peerId,
            fromName:myProfile.name,
            ciphertext:cipher,
            sentAt:Date.now()
          });
          status("send-status", formatName(recipient.displayName) + "へ送信しました。", "ok");
          $("message").value = "";
          $("count").textContent = "0 / 180";
        } catch {
          status("send-status", "送信できませんでした。相手の接続状態を確認してください。", "bad");
        }
      };

      if (conn.open) sendPacket();
      else conn.on("open", sendPacket);
    } catch {
      status("send-status", "暗号化に失敗しました。", "bad");
    }
  }

  async function copyText(text, statusId, msg) {
    try {
      await navigator.clipboard.writeText(text);
      status(statusId, msg, "ok");
    } catch {
      status(statusId, "コピーできませんでした。", "bad");
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    loadProfile();
    showKeys();
    $("share-url").value = location.href;

    $("generate-key").addEventListener("click", () => {
      const name = $("display-name").value.trim();
      if (!name) {
        status("register-status", "先に表示名を入力してください。", "bad");
        return;
      }
      generatePair();
    });

    $("register-button").addEventListener("click", register);
    $("clear-local").addEventListener("click", clearLocal);

    $("recipient").addEventListener("change", syncRecipientKey);
    $("encrypt-button").addEventListener("click", encryptAndSend);
    $("copy-cipher").addEventListener("click", () => copyText(latestCipher, "send-status", "暗号文をコピーしました。"));

    $("message").addEventListener("input", () => {
      $("count").textContent = $("message").value.length + " / 180";
    });

    $("copy-url").addEventListener("click", () => copyText(location.href, "register-status", "共有URLをコピーしました。"));

    if (myProfile && valid3(myProfile.publicKey) && valid3(myProfile.privateKey)) {
      setTimeout(() => register(), 250);
    }
  });
})();
</script>
